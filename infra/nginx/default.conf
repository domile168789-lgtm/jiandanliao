server {
  listen 80;

  location /api/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_pass http://api:3001;
  }

  location /socket.io/ {
    proxy_pass http://ws:3002/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # 让客户端可以通过同域名 /uploads/ 直连 MinIO（阶段 1 直传方案）
  location /uploads/ {
    proxy_pass http://minio:9000/uploads/;
  }

  location /downloads/ {
    proxy_pass http://user-web:80/downloads/;
  }

  location /h5 {
    proxy_pass http://user-web:80/h5;
  }

  location /app {
    proxy_pass http://user-web:80/app;
  }

  location = /health {
    proxy_pass http://ws:3002/health;
  }

  # Nginx 自身健康检查
  location /healthz {
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
