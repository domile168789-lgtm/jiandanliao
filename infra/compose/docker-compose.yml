x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: "${DOCKER_LOG_MAX_FILE:-3}"

services:
  nginx:
    build:
      context: ../..
      dockerfile: infra/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      api:
        condition: service_healthy
      ws:
        condition: service_healthy
      user-web:
        condition: service_healthy
      minio:
        condition: service_healthy

  user-web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: ${API_PORT:-3001}
      JWT_SECRET: ${JWT_SECRET:-12345678901234567890123456789012}
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-root}@mysql:3306/${MYSQL_DATABASE:-jianliao}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # 阶段 1 直传：建议对外使用 Nginx 同域名 /uploads/
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://nginx}
      UPLOAD_ROOT: /data/uploads
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    volumes:
      - jianliao_uploads:/data/uploads
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${API_PORT:-3001}/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  ws:
    build:
      context: ../..
      dockerfile: apps/ws/Dockerfile
    restart: unless-stopped
    environment:
      WS_PORT: ${WS_PORT:-3002}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "${WS_PORT:-3002}:${WS_PORT:-3002}"
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${WS_PORT:-3002}/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jianliao}
    volumes:
      - ../mysql:/docker-entrypoint-initdb.d:ro
      - jianliao_mysql:/var/lib/mysql
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - jianliao_redis:/data
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - jianliao_minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10

  # 初始化 bucket 与匿名策略（阶段 1：直传需要 public）
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    logging: *default-logging
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb -p local/uploads || true &&
      mc anonymous set public local/uploads || true
      "

volumes:
  jianliao_mysql:
  jianliao_redis:
  jianliao_minio:
  jianliao_uploads:
